apiVersion: v1
kind: ConfigMap
metadata:
  name: index-now
  namespace: default
data:
  # Replace this with your actual 8-to-128 character hexadecimal IndexNow key
  INDEXNOW_KEY: "ad03bc4dd63e496192c64e66a3d6dd0f"
  server.mjs: |
    import http from 'node:http';

    const indexNowKey = process.env.INDEXNOW_KEY || '';
    const keyPath = `/${indexNowKey}.txt`;
    const keyBody = Buffer.from(indexNowKey, 'utf8');

    const server = http.createServer((req, res) => {
      const isGetOrHead = req.method === 'GET' || req.method === 'HEAD';

      if (indexNowKey && req.url === keyPath && isGetOrHead) {
        res.writeHead(200, {
          'Content-Type': 'text/plain; charset=utf-8',
          'Content-Length': keyBody.byteLength,
          'Cache-Control': 'public, max-age=300',
        });
        res.end(req.method === 'HEAD' ? undefined : keyBody);
        return;
      }

      res.writeHead(404, { 'Content-Type': 'text/plain' });
      res.end('Not Found');
    });

    server.listen(8080, '0.0.0.0');
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: index-now
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: index-now
  template:
    metadata:
      labels:
        app: index-now
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: index-now-server
          image: gcr.io/distroless/nodejs22-debian12:nonroot
          args: ["/app/server.mjs"]
          env:
            - name: INDEXNOW_KEY
              valueFrom:
                configMapKeyRef:
                  name: index-now
                  key: INDEXNOW_KEY
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: app-code
              mountPath: /app
              readOnly: true
      volumes:
        - name: app-code
          configMap:
            name: index-now

---
apiVersion: v1
kind: Service
metadata:
  name: index-now
  namespace: default
spec:
  selector:
    app: index-now
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: index-now
  namespace: default
spec:
  entryPoints:
    - websecure
  tls:
    certResolver: myresolver
  routes:
    - match: Host(`pocketcoach.fit`) && Path(`/indexnow/`)
      kind: Rule
      priority: 100
      services:
        - name: index-now
          port: 80
