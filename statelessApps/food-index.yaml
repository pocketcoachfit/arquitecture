apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-index
spec:
  selector:
    matchLabels:
      app: food-index
  replicas: 1
  template:
    metadata:
      labels:
        app: food-index # has to match .spec.selector.matchLabels
    spec:
      imagePullSecrets:
        - name: registry-key-secret
      containers:
        - name: food-index
          image: ghcr.io/pocketcoachfit/food-index:v1.1.0
          ports:
            - name: main
              containerPort: 3000
          volumeMounts:
            - name: local-envfile
              mountPath: /app/.env.local
      volumes:
        - name: local-envfile
          hostPath:
            path: /secrets/food-index/.env.local
            type: File

---
apiVersion: v1
kind: Service
metadata:
  name: food-index
spec:
  selector:
    app: food-index
  ports:
    - protocol: TCP
      port: 80
      targetPort: main
