apiVersion: v1
kind: ConfigMap
metadata:
  name: test-sitemap-config
  namespace: default
data:
  server.mjs: |
    import http from 'node:http';

    const xml = Buffer.from(
      '<?xml version="1.0" encoding="UTF-8"?>\n' +
      '<urlset xmlns="http://sitemaps.org">\n' +
      '  <url>\n' +
      '    <loc>https://pocketcoach.fit</loc>\n' +
      '  </url>\n' +
      '</urlset>\n',
      'utf8'
    );

    const server = http.createServer((req, res) => {
      if (req.url === '/test-sitemap.xml' && (req.method === 'GET' || req.method === 'HEAD')) {
        res.writeHead(200, {
          'Content-Type': 'application/xml; charset=utf-8',
          'Content-Length': xml.byteLength,
          'Cache-Control': 'public, max-age=300',
        });
        res.end(req.method === 'HEAD' ? undefined : xml);
        return;
      }
      res.writeHead(404, { 'Content-Type': 'text/plain' });
      res.end('Not Found');
    });

    server.listen(8080, '0.0.0.0');
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sitemap-test
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sitemap-test
  template:
    metadata:
      labels:
        app: sitemap-test
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: node-sitemap
          image: gcr.io/distroless/nodejs22-debian12:nonroot
          args: ["/app/server.mjs"]
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: app-code
              mountPath: /app/server.mjs
              subPath: server.mjs
              readOnly: true
      volumes:
        - name: app-code
          configMap:
            name: test-sitemap-config
---
apiVersion: v1
kind: Service
metadata:
  name: sitemap-test
  namespace: default
spec:
  selector:
    app: sitemap-test
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sitemap-test-route
  namespace: default
spec:
  entryPoints:
    - websecure
  tls:
    certResolver: myresolver
  routes:
    - match: Host(`pocketcoach.fit`) && Path(`/test-sitemap.xml`)
      kind: Rule
      priority: 100
      services:
        - name: sitemap-test
          port: 80
